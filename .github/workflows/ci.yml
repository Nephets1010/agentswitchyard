name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同分支的新 push 直接取消旧构建，省 CI 配额
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAVEN_VERSION: 3.9.9
  JAVA_VERSION: '21'

jobs:
  # ============================================================
  # Job 1：编译 + 单元测试 + 集成测试（含 kill -9 崩溃恢复）+ 覆盖率门禁
  # ★ CI 零外部依赖：全部用 WireMock 与本仓 mock-llm，绝不调用真实模型 API、零费用
  # ============================================================
  verify:
    # ★ 这里必须写死版本号，不能用 ${{ env.JAVA_VERSION }}。
    #   job 的 name 字段在 workflow 解析的极早期求值，此时 env 尚未填充，
    #   GitHub 会直接拒绝整个文件（报错还连带后面所有 job 都创建不出来）。
    name: verify (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: 打印工具链版本
        run: java -version && ./mvnw -version

      - name: 缓存 Maven 依赖
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: 离线依赖预热
        run: ./mvnw -B -ntp dependency:go-offline -DexcludeArtifactIds=agentswitchyard-core,agentswitchyard-store,agentswitchyard-spring-boot-starter,agentswitchyard-mock-llm || true

      # 覆盖率门禁（core ≥ 80% / store ≥ 65% / 其余 ≥ 60%）在 jacoco:check 里，低于阈值本步即失败
      # 含 CrashResumeIT：ProcessBuilder 起真子进程跑一半 → destroyForcibly()（kill -9）→ 新进程续跑
      - name: 编译 + 测试 + 崩溃恢复 + 覆盖率门禁
        run: ./mvnw -B -ntp clean verify -Dstyle.color=never

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: '**/target/site/jacoco/index.html'
          retention-days: 14

  # ============================================================
  # Job 2：格式检查（spotless：google-java-format AOSP）
  # ============================================================
  spotless:
    name: spotless
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: 检查代码格式（google-java-format AOSP）
        run: ./mvnw -B -ntp spotless:check -Dstyle.color=never

  # ============================================================
  # Job 2b：workflow 自身语法门禁
  # ★ 为什么需要这个 job：GitHub 解析 workflow 失败时是**整个文件拒绝、所有 job
  #   一个都不创建**，而报错信息完全指不到真实原因。更糟的是这类错误在本地看不出来：
  #   YAML 同层重复键会被解析器静默取最后一个。①仓首次上线时 5 个 job 全部无法创建。
  # ============================================================
  workflow-syntax:
    name: workflow-syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ★ 必须显式装 PyYAML：actions/setup-python 只保证解释器可用，不带第三方包
      - name: 安装脚本依赖
        run: python -m pip install --upgrade pip && python -m pip install "PyYAML==6.0.2"

      - name: 静态校验（重复键 / env 作用域 / 本地脚本存在性）
        run: python tools/validate_workflows.py

      - name: 构建上下文完整性（.dockerignore 是否把 Dockerfile 需要的东西排除了）
        run: python tools/check_dockerignore.py --selftest && python tools/check_dockerignore.py

      # actionlint 的解析器与 GitHub 服务端同源，是唯一能提前复现服务端解析行为的工具
      - name: actionlint（与 GitHub 服务端同源的解析器）
        run: |
          set -euo pipefail
          VER=1.7.7
          curl -sSL --max-time 60 \
            -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${VER}/actionlint_${VER}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          # actionlint 禁用颜色用 -no-color（-color 是布尔开关，不接受 '=never'）
          ./actionlint -no-color .github/workflows/*.yml
          echo "actionlint 通过"

  # ============================================================
  # Job 3：契约一致性（§2.6）
  # 三仓不共享 jar，只共享 contract/contract-v1.json 的语义。
  # ============================================================
  contract-consistency:
    name: contract-consistency
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: 契约字段 / 类型 / 枚举逐字符校验
        run: ./mvnw -B -ntp -pl core test -Dtest='ContractSchemaTest' -Dsurefire.failIfNoSpecifiedTests=false -Dstyle.color=never

      - name: 校验契约文件是合法 JSON 且版本号受支持
        run: |
          python3 - <<'PY'
          import json, sys
          with open('contract/contract-v1.json', encoding='utf-8') as f:
              c = json.load(f)
          assert c['contractVersion'] == 'v1', c['contractVersion']
          need = {'CTX-001','USG-001','PRC-001','EVT-001','ERR-001','SPN-001'}
          missing = need - set(c['contracts'])
          assert not missing, f'契约缺失: {missing}'
          for name, attrs in c['contracts'].items():
              for a in attrs.get('customAttributes', []):
                  assert a['name'].startswith('swy.'), f'{name} 的自定义属性必须用 swy. 前缀: {a["name"]}'
          # 本仓独占写入的属性必须在契约登记为 agentswitchyard 专属
          for name, attrs in c['contracts'].items():
              for a in attrs.get('customAttributes', []):
                  if a['name'] in ('swy.flow.instance.id','swy.step.id','swy.step.seq','swy.step.kind','swy.approval.state'):
                      assert 'agentswitchyard' in a['in'] and 'switchyard' not in a['in'], \
                          f"{a['name']} 必须由本仓独占写入"
          print('contract-v1.json 校验通过')
          PY

  # ============================================================
  # Job 4：架构边界门禁
  #   ① core 零 Spring Boot/Web/Servlet 依赖
  #   ② 依赖树不含另两个仓库、不含 LangGraph4j（首版刻意不引入，ADR-0002）
  # ============================================================
  architecture-boundaries:
    name: architecture-boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: core 模块禁止出现 Spring Boot / Web / Servlet 依赖
        # ★ 两条命令必须在同一个 run 块里：写成两个平级的 run: 会被 YAML 同层重复键
        #   静默覆盖，第二条根本不执行 —— 门禁看起来在跑实际什么都没检查（①仓实测踩坑）。
        run: |
          ./mvnw -B -ntp -pl core dependency:list -DoutputFile=/tmp/core-deps.txt -DincludeScope=compile
          if [ ! -s /tmp/core-deps.txt ]; then
            echo "::error::dependency:list 未产出依赖清单，门禁无法判定（请勿用 -q 静默失败）"
            exit 1
          fi
          # 允许 org.springframework.ai:*（ReplayChatModel 实现的 ChatModel SPI，ADR-0001）；
          # 禁止 Spring Boot / Spring Web / Servlet。
          if grep -E 'org\.springframework\.boot:|org\.springframework:spring-(web|webmvc|webflux|context:)' /tmp/core-deps.txt | grep -v 'org\.springframework\.ai:'; then
            echo "::error::core 模块出现 Spring Boot/Web 依赖，违反 ADR-0001"
            exit 1
          fi
          if grep -E 'jakarta\.servlet' /tmp/core-deps.txt; then
            echo "::error::core 模块出现 Servlet 依赖，违反 ADR-0001"
            exit 1
          fi
          echo "core 依赖树边界完好"

      - name: 禁止依赖另两个 LLM 基建仓库与 LangGraph4j
        run: |
          ./mvnw -B -ntp dependency:tree -DoutputFile=/tmp/full-tree.txt
          if [ ! -s /tmp/full-tree.txt ]; then
            echo "::error::dependency:tree 未产出依赖树，门禁无法判定"
            exit 1
          fi
          if grep -E 'llm-switchyard|glasshouse|langgraph4j' /tmp/full-tree.txt; then
            echo "::error::依赖树中出现另两个仓库或 LangGraph4j，违反 ADR-0002 / 决策 4"
            exit 1
          fi
          echo "依赖树干净：无跨仓依赖、无图编排引擎（首版刻意选择，见 README）"

  # ============================================================
  # Job 5：docker compose 零 Key 冒烟（PostgreSQL + sample + mock-llm）
  # ============================================================
  compose-smoke:
    name: compose-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 校验 compose 文件语法
        run: docker compose config --quiet

      # ★ --no-cache 不是为了「绕开缓存污染」，而是为了让失败可归因
      - name: 构建并启动
        run: docker compose build --no-cache && docker compose up -d

      - name: 等待 sample 真正就绪
        # ★ depends_on: service_healthy 只保证依赖服务健康后 sample【开始启动】，
        #   sample 自己的 Spring Boot 启动（含 Flyway 迁移）还要几秒。
        #   必须轮询探测到 200 才能继续 —— healthcheck 过了就立刻 curl 是启动竞态（①仓实测）。
        run: |
          attempts=0
          while [ "$attempts" -lt 60 ]; do
            if curl -fsS http://localhost:18080/demo/health >/dev/null 2>&1; then
              echo "sample 就绪"; exit 0
            fi
            attempts=$((attempts + 1))
            sleep 3
          done
          echo "::error::sample 180s 内未就绪"; docker compose logs; exit 1

      - name: 启动流程并等待审批挂起
        run: |
          curl -fsS -XPOST http://localhost:18080/demo/flow/start \
            -H 'Content-Type: application/json' \
            -d '{"ref":"ORD-9931"}' | tee /tmp/start.json
          IID=$(python3 -c "import json;print(json.load(open('/tmp/start.json',encoding='utf-8'))['flowInstanceId'])")
          echo "IID=$IID" >> "$GITHUB_ENV"
          # start 返回 PENDING（异步执行），轮询直到挂起等待审批
          attempts=0
          while [ "$attempts" -lt 30 ]; do
            ST=$(curl -fsS "http://localhost:18080/_switchyard/flows/instances/${IID}" | python3 -c "import json,sys;print(json.load(sys.stdin)['state'])")
            if [ "$ST" = "WAITING_APPROVAL" ]; then echo "流程挂起等待审批"; exit 0; fi
            attempts=$((attempts + 1))
            sleep 2
          done
          echo "::error::流程未在 60s 内挂起，最终状态 $ST"; docker compose logs sample; exit 1

      - name: 审批通过后流程跑完（幂等 + 补偿声明生效）
        run: |
          IID="${{ env.IID }}"
          AID=$(curl -fsS http://localhost:18080/demo/approvals | python3 -c "import json,sys;print(json.load(sys.stdin)[0]['approvalId'])")
          curl -fsS -XPOST "http://localhost:18080/_switchyard/approval/${AID}/decide" \
            -H 'Content-Type: application/json' \
            -d '{"approver":"zhang-san","approverRole":"risk-officer","approved":true,"note":"人工复核通过"}' \
            | tee /tmp/decide.json
          python3 -c "
          import json
          d = json.load(open('/tmp/decide.json', encoding='utf-8'))
          assert d['state'] == 'APPROVED', d
          print('审批 OK')
          "
          # 等流程跑完 5 步
          attempts=0
          while [ "$attempts" -lt 30 ]; do
            ST=$(curl -fsS "http://localhost:18080/demo/flow/${IID}" | python3 -c "import json,sys;print(json.load(sys.stdin)['state'])")
            if [ "$ST" = "SUCCEEDED" ]; then echo "流程完成"; exit 0; fi
            attempts=$((attempts + 1))
            sleep 2
          done
          echo "::error::流程未在 60s 内完成，最终状态 $ST"; docker compose logs sample; exit 1

      - name: 确定性回放（响应注入，TraceDiff 应为空）
        run: |
          IID="${{ env.IID }}"
          curl -fsS -XPOST "http://localhost:18080/_switchyard/replay/${IID}" | tee /tmp/replay.json
          python3 -c "
          import json
          d = json.load(open('/tmp/replay.json', encoding='utf-8'))
          assert d['identical'] is True, f'回放应与历史一致，实际: {d}'
          print('回放 OK（响应注入，零上游调用）')
          "

      - name: 轨迹报告导出（Markdown，含每步耗时与成本）
        run: |
          IID="${{ env.IID }}"
          curl -fsS "http://localhost:18080/_switchyard/trace/${IID}/report" -o /tmp/report.md
          grep -q '成本' /tmp/report.md && grep -q '耗时' /tmp/report.md && echo "报告导出 OK"

      - name: 收集日志
        if: failure()
        run: docker compose logs --no-color

      - name: 关闭环境
        if: always()
        run: docker compose down -v
